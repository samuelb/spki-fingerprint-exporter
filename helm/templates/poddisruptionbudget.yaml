{{- if .Values.podDisruptionBudget.enabled }}
{{- /* Compare as strings: 0 is a valid value, but empty for `with`, `if` and `default`. */ -}}
{{- $minAvailable := "" }}
{{- $maxUnavailable := "" }}
{{- if not (kindIs "invalid" .Values.podDisruptionBudget.minAvailable) }}
{{- $minAvailable = toString .Values.podDisruptionBudget.minAvailable }}
{{- end }}
{{- if not (kindIs "invalid" .Values.podDisruptionBudget.maxUnavailable) }}
{{- $maxUnavailable = toString .Values.podDisruptionBudget.maxUnavailable }}
{{- end }}
{{- if and (ne $minAvailable "") (ne $maxUnavailable "") }}
{{- fail "podDisruptionBudget accepts either minAvailable or maxUnavailable, not both; set the other one to \"\"" }}
{{- end }}
{{- if and (eq $minAvailable "") (eq $maxUnavailable "") }}
{{- fail "podDisruptionBudget needs one of minAvailable or maxUnavailable" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "spki-fingerprint-exporter.fullname" . }}
  labels:
    {{- include "spki-fingerprint-exporter.labels" . | nindent 4 }}
spec:
  {{- if ne $minAvailable "" }}
  minAvailable: {{ $minAvailable }}
  {{- else }}
  maxUnavailable: {{ $maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "spki-fingerprint-exporter.selectorLabels" . | nindent 6 }}
{{- end }}
